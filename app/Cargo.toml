[package]
name = "merces"
description = "Merces: 3D dashboard of AI trading agents (research, chart, decision, execution) built with Bevy and egui."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "merces"

[dependencies]
merces-core.workspace = true
merces-agents.workspace = true
merces-market.workspace = true
merces-llm.workspace = true
merces-store.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true

bevy = { version = "0.20.1", default-features = false, features = [
    "default_app",
    "default_platform",
    "3d_bevy_render",
    "picking",
] }
bevy_egui = { version = "0.43.1", default-features = false, features = [
    "render",
    "picking",
    "manage_clipboard",
    "open_url",
    "default_fonts",
] }
bevy_framepace = "0.23"
crossbeam-channel = "0.5"
directories = "6"
toml = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }
rfd = "0.18"

[features]
# Faster incremental builds while developing: cargo run --features dev
dev = ["bevy/dynamic_linking"]
