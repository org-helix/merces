[workspace]
resolver = "3"
members = ["crates/*", "app"]
default-members = ["app"]


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.95"

[workspace.dependencies]
merces-core = { path = "crates/merces-core" }
merces-ta = { path = "crates/merces-ta" }
merces-market = { path = "crates/merces-market" }
merces-llm = { path = "crates/merces-llm" }
merces-store = { path = "crates/merces-store" }
merces-agents = { path = "crates/merces-agents" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
tracing = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
